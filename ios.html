<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Engo3 App iOS 內部安裝</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --accent: #1a7f37; --accent-text: #ffffff; --border: #d1d9e0; --warn: #9a6700; --warn-bg: #fff8c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --accent: #238636; --accent-text: #ffffff; --border: #30363d; --warn: #d29922; --warn-bg: #272115;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; padding: 1.5rem 1rem 3rem; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .sub { color: var(--muted); font-size: .875rem; margin-bottom: 1rem; }
  .note { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--border); border-radius: 8px; padding: .75rem 1rem; font-size: .85rem; line-height: 1.6; margin-bottom: 1.5rem; }
  .release { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .release-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .ver { font-size: 1.15rem; font-weight: 700; }
  .latest-badge { background: var(--accent); color: var(--accent-text); font-size: .7rem; padding: .15rem .5rem; border-radius: 999px; font-weight: 600; }
  .date { color: var(--muted); font-size: .8rem; }
  .assets { margin-top: .75rem; display: flex; flex-direction: column; gap: .5rem; }
  .asset-row { display: flex; align-items: stretch; gap: .5rem; }
  a.dl { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: .75rem; text-decoration: none; background: var(--accent); color: var(--accent-text); border-radius: 8px; padding: .65rem 1rem; font-weight: 600; font-size: .95rem; }
  a.dl .size { font-weight: 400; font-size: .8rem; opacity: .85; }
  .qr { flex: none; width: 76px; height: 76px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 5px; }
  @media (max-width: 520px) { .qr { display: none; } }
  .status { color: var(--muted); text-align: center; padding: 2rem 0; }
</style>
</head>
<body>
<main>
  <h1>Engo3 App iOS 內部安裝</h1>
  <p class="sub">用 iPhone 的 Safari 開這一頁，點「安裝」即可，不需要 TestFlight。</p>
  <div class="note">
    <strong>只有已註冊的測試機能裝。</strong>安裝包在打包當下就固化了裝置清單，
    若你的手機沒被登記，點安裝會失敗——請把手機 UDID 給開發者登記，等下一版重新打包。<br>
    電腦上開這頁的話，用手機掃右側 QR 即可跳到同一頁。
  </div>
  <div id="list"><p class="status">載入版本列表中…</p></div>
</main>
<script src="./vendor/qrcode.js"></script>
<script>
const PAGE_URL = 'https://smart-engo-technology-corp.github.io/engo3-apk/ios.html';
const list = document.getElementById('list');
fetch('./releases.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(releases => {
    // ad-hoc IPA 檔名固定以 _ios_adhoc.ipa 結尾，其餘資產（APK、App Store IPA）不列
    const items = releases.filter(r => !r.draft && r.assets.some(a => a.name.endsWith('_ios_adhoc.ipa')));
    if (!items.length) { list.innerHTML = '<p class="status">目前還沒有可安裝的 iOS 版本。</p>'; return; }
    list.innerHTML = items.map((r, i) => {
      const date = new Date(r.published_at).toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
      const assets = r.assets.filter(a => a.name.endsWith('_ios_adhoc.ipa')).map(a => {
        // manifest 與 tag 一對一：tag 內的 + 在檔名／網址都不好處理，統一換成底線
        const safeTag = r.tag_name.replace(/\+/g, '_');
        const manifest = `https://smart-engo-technology-corp.github.io/engo3-apk/ios/${safeTag}.plist`;
        const href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifest)}`;
        const ver = a.name.replace(/\.ipa$/, '').replace(/_ios_adhoc$/, '');
        return `<a class="dl" href="${href}"><span>安裝 iOS - ${ver}</span><span class="size">${(a.size / 1048576).toFixed(1)} MB</span></a>`;
      }).join('');
      // QR 只給最新版：內容是本頁網址而非 itms-services——
      // iOS 相機對自訂 scheme 多半直接無視，掃到 https 才會開
      const qr = i === 0 ? `<canvas class="qr" data-url="${PAGE_URL}"></canvas>` : '';
      return `<section class="release">
        <div class="release-head">
          <span class="ver">${r.name || r.tag_name}</span>
          ${i === 0 ? '<span class="latest-badge">最新</span>' : ''}
          <span class="date">${date}</span>
        </div>
        <div class="assets"><div class="asset-row">${assets}${qr}</div></div>
      </section>`;
    }).join('');
    drawQrCodes();
  })
  .catch(e => { list.innerHTML = `<p class="status">版本列表載入失敗（${e.message}），請重新整理。</p>`; });

function drawQrCodes() {
  document.querySelectorAll('canvas.qr').forEach(cv => {
    try {
      const qr = qrcode(0, 'L');
      qr.addData(cv.dataset.url);
      qr.make();
      const n = qr.getModuleCount(), quiet = 2, scale = 3, px = (n + quiet * 2) * scale;
      cv.width = px; cv.height = px;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
      ctx.fillStyle = '#000';
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++)
          if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
    } catch (e) { cv.remove(); }
  });
}
</script>
</body>
</html>
