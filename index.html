<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Engo3 App 版本下載</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --accent: #1a7f37; --accent-text: #ffffff; --border: #d1d9e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --accent: #238636; --accent-text: #ffffff; --border: #30363d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; padding: 1.5rem 1rem 3rem; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .sub { color: var(--muted); font-size: .875rem; margin-bottom: 1.5rem; }
  .release { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .release-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .ver { font-size: 1.15rem; font-weight: 700; }
  .latest-badge { background: var(--accent); color: var(--accent-text); font-size: .7rem; padding: .15rem .5rem; border-radius: 999px; font-weight: 600; }
  .date { color: var(--muted); font-size: .8rem; }
  .notes { color: var(--muted); font-size: .875rem; margin-top: .5rem; white-space: pre-wrap; }
  .assets { margin-top: .75rem; display: flex; flex-direction: column; gap: .5rem; }
  a.dl { display: flex; justify-content: space-between; align-items: center; gap: .75rem; text-decoration: none; background: var(--accent); color: var(--accent-text); border-radius: 8px; padding: .65rem 1rem; font-weight: 600; font-size: .95rem; }
  a.dl .size { font-weight: 400; font-size: .8rem; opacity: .85; }
  /* 環境徽章：紅=正式（裝錯影響真實用戶），藍=測試；舊檔名無環境段不顯示 */
  .env-badge { display: inline-block; font-size: .7rem; font-weight: 700; padding: .1rem .45rem; border-radius: 999px; margin-right: .5rem; vertical-align: 1px; }
  .env-prd { background: #cf222e; color: #ffffff; }
  .env-stg { background: #0969da; color: #ffffff; }
  .os-badge { display: inline-block; font-size: .7rem; font-weight: 700; padding: .1rem .45rem; border-radius: 999px; margin-right: .35rem; vertical-align: 1px; background: #6e7781; color: #fff; }
  /* 本頁網址 QR：給人轉傳這一頁用。與資產列的 QR 不同，手機上照樣顯示——
     用途是拿自己的螢幕給旁邊的人掃，不是自己掃自己 */
  .page-share { display: flex; align-items: center; gap: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .page-share .txt { min-width: 0; }
  .page-share .txt strong { display: block; font-size: .95rem; margin-bottom: .2rem; }
  .page-share .txt code { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
  .page-share canvas { flex: none; width: 92px; height: 92px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 5px; }
  .status { color: var(--muted); text-align: center; padding: 2rem 0; }
  /* QR：只給最新版顯示，供電腦開頁時用手機掃碼直接下載 */
  .asset-row { display: flex; align-items: stretch; gap: .5rem; }
  .asset-row a.dl { flex: 1; min-width: 0; }
  .asset-row a.dl span:first-child { overflow-wrap: anywhere; }
  /* 底色固定白、留白邊——QR 靠明暗對比辨識，深色模式反白會掃不到 */
  .qr { flex: none; width: 76px; height: 76px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 5px; }
  /* 手機開這頁時自己掃自己沒有意義，直接不佔版面 */
  @media (max-width: 520px) { .qr { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Engo3 App 版本下載</h1>
  <p class="sub">Android 直接點「下載 APK」，安裝時若跳出「不明來源」提示，允許即可。<br>
  iOS 請用 Safari 點「安裝 iOS」，不需要 TestFlight——但<strong>僅限已登記的測試機</strong>，
  未登記的手機會安裝失敗，請把手機 UDID 給開發者登記，等下一版重新打包。</p>
  <div class="page-share">
    <canvas id="pageQr"></canvas>
    <div class="txt">
      <strong>掃描開啟本頁</strong>
      <code>https://smart-engo-technology-corp.github.io/engo3-apk/</code>
    </div>
  </div>
  <div id="list"><p class="status">載入版本列表中…</p></div>
</main>
<script src="./vendor/qrcode.js"></script>
<script>
const REPO = 'Smart-enGo-Technology-Corp/engo3-apk';
const list = document.getElementById('list');
// 優先讀同站靜態 releases.json（發版時由 release.sh 更新），避開 GitHub API 匿名額度；讀不到才退回 API
fetch('./releases.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .catch(() => fetch(`https://api.github.com/repos/${REPO}/releases?per_page=50`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
  .then(releases => {
    // 同一個版號底下並列兩個平台的安裝檔，不另開頁面
    const isInstallable = a => a.name.endsWith('.apk') || a.name.endsWith('_ios_adhoc.ipa');
    const items = releases.filter(r => !r.draft && r.assets.some(isInstallable));
    if (!items.length) { list.innerHTML = '<p class="status">目前還沒有可下載的版本。</p>'; return; }
    list.innerHTML = items.map((r, i) => {
      const date = new Date(r.published_at).toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
      const assets = r.assets.filter(isInstallable).map(a => {
        const isIos = a.name.endsWith('_ios_adhoc.ipa');
        // 環境徽章：檔名固定帶 _stg_ / _prd_ 段；紅=正式（裝錯影響真實用戶），藍=測試
        const envMatch = a.name.match(/_(stg|prd)_/);
        const envBadge = envMatch ? `<span class="env-badge env-${envMatch[1]}">${envMatch[1] === 'prd' ? '正式 PRD' : '測試 STG'}</span>` : '';
        let href, label, qrUrl;
        if (isIos) {
          // OTA manifest 與 tag 一對一；tag 內的 + 在網址與檔名都不好處理，統一換底線
          const manifest = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}ios/${r.tag_name.replace(/\+/g, '_')}.plist`;
          href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifest)}`;
          label = `${envBadge}<span class="os-badge">iOS</span>安裝 iOS - ${a.name.replace(/_ios_adhoc\.ipa$/, '')}`;
          // iOS 的 QR 編本頁網址而非 itms-services：相機對自訂 scheme 多半直接無視，
          // 掃到 https 才會開；掃碼進頁後再點安裝
          qrUrl = location.href.split('#')[0];
        } else {
          const device = a.name.includes('_phone') ? 'Android Phone' : 'Android Tablet';
          const ver = a.name.replace(/\.apk$/, '').replace(/_(phone|tablet)$/, '').replace(/_(stg|prd)$/, '');
          href = a.browser_download_url;
          label = `${envBadge}<span class="os-badge">Android</span>下載 APK - ${device} - ${ver}`;
          qrUrl = a.browser_download_url;
        }
        const btn = `<a class="dl" href="${href}"><span>${label}</span><span class="size">${(a.size / 1048576).toFixed(1)} MB</span></a>`;
        // 只有最新版掛 QR：舊版多是查閱用途，全掛會讓頁面塞滿上百個 QR
        if (i !== 0) return btn;
        return `<div class="asset-row">${btn}<canvas class="qr" data-url="${qrUrl}"></canvas></div>`;
      }).join('');
      const notesText = (r.body || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .split('\n')
        .map(l => l.replace(/^#+\s*(.*)$/, '<strong>$1</strong>').replace(/^-{3,}$/, ''))
        .join('\n').replace(/\n{3,}/g, '\n\n').trim();
      const notes = notesText ? `<p class="notes">${notesText}</p>` : '';
      return `<section class="release">
        <div class="release-head">
          <span class="ver">${r.name || r.tag_name}</span>
          ${i === 0 ? '<span class="latest-badge">最新</span>' : ''}
          <span class="date">${date}</span>
        </div>
        ${notes}
        <div class="assets">${assets}</div>
      </section>`;
    }).join('');
    drawQrCodes();
  })
  .catch(e => { list.innerHTML = `<p class="status">版本列表載入失敗（${e.message}），請重新整理。</p>`; });

// 以 canvas 畫 QR。ECC 用 L：內容是固定網址、螢幕上不會髒污，
// 換取較低版本、較大的格子，遠一點也掃得到
const PAGE_URL = 'https://smart-engo-technology-corp.github.io/engo3-apk/';

// 本頁網址的 QR 不依賴 releases.json，載入即可畫，不必等列表回來
drawQr(document.getElementById('pageQr'), PAGE_URL);

function drawQr(cv, text) {
  if (!cv) return;
  try {
    const qr = qrcode(0, 'L');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount(), quiet = 2, scale = 3, px = (n + quiet * 2) * scale;
    cv.width = px; cv.height = px;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
  } catch (e) {
    cv.remove();
  }
}

function drawQrCodes() {
  // 靜區規格建議 4 格，這裡取 2 再靠 CSS padding 補足
  document.querySelectorAll('canvas.qr').forEach(cv => drawQr(cv, cv.dataset.url));
}
</script>
</body>
</html>
